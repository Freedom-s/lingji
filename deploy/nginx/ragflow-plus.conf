# =====================================================================
# RAGFlow-Plus 前后台部署（shiyanshi，IP + 端口访问，无需域名）
#   学生端   http://<IP>/       (端口 80)   -> 前台 web/dist        -> 后端 9380
#   教师端   http://<IP>:8080/  (端口 8080) -> 后台 management/web/dist -> 后端 5000
# =====================================================================

# ===================== 前台（学生端，端口 80） =====================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /home/user/jianhuasuo/lingji/web/dist;
    index index.html;

    client_max_body_size 10G;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 反向代理到前台后端 (9380)；/v1 与 /api 与开发代理一致
    location ~ ^/(v1|api) {
        proxy_pass http://127.0.0.1:9380;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE（对话流式输出）需要关闭缓冲 + 长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 静态资源 + SPA（history 路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ===================== 后台（教师管理端，端口 8080） =====================
server {
    listen 8080;
    server_name _;

    root /home/user/jianhuasuo/lingji/management/web/dist;
    index index.html;

    client_max_body_size 10G;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 反向代理到后台后端 (5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传和视频处理需要长超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 静态资源 + SPA（hash 路由，保留 fallback）
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
