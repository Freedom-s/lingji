# GPU 服务 Docker Compose 配置
# 包含 qwen3-vl-service, qwen3-rerank-service, mineru-ocr-service
#
# 使用方法:
#   1. 复制 gpu-services/.env.example 为 gpu-services/.env 并修改配置
#   2. docker compose -f docker-compose-gpu-services.yml up -d

services:
  # Qwen3 VL 视觉语言模型服务
  qwen3-vl-service:
    build:
      context: ./qwen3-vl-service
      dockerfile: Dockerfile
    container_name: qwen3-vl-service
    ports:
      - "8000:8000"
    env_file:
      - gpu-services/.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-all}
      - MODEL_PATH=${QWEN_VL_MODEL_PATH}
      - MAX_BATCH_SIZE=${QWEN_VL_MAX_BATCH_SIZE:-1}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - MINIO_SECURE=${MINIO_SECURE:-false}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - gpu-services
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Qwen3 Rerank 重排序服务
  qwen3-rerank-service:
    build:
      context: ./qwen3-rerank-service
      dockerfile: Dockerfile
    container_name: qwen3-rerank-service
    ports:
      - "8001:8001"
    env_file:
      - gpu-services/.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-all}
      - MODEL_PATH=${QWEN_RERANK_MODEL_PATH}
      - MAX_BATCH_SIZE=${QWEN_RERANK_MAX_BATCH_SIZE:-1}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - MINIO_SECURE=${MINIO_SECURE:-false}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - gpu-services
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MinerU OCR 文档解析服务
  mineru-ocr-service:
    build:
      context: ./mineru-ocr-service
      dockerfile: Dockerfile
    container_name: mineru-ocr-service
    ports:
      - "8888:8888"
    env_file:
      - gpu-services/.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-all}
      - MAGIC_pdf_TYPE=${MINERU_PARSE_METHOD:-auto}
    volumes:
      - mineru-output:/app/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - gpu-services
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  gpu-services:
    driver: bridge
    name: gpu-services-network

volumes:
  mineru-output:
    name: mineru-output-data
