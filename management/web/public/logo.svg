<svg viewBox="0 0 160 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 灵机 Logo - 智能灯泡 + 文字 -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 灯泡图标 -->
  <g transform="translate(8, 6)">
    <!-- 灯泡主体 -->
    <path d="M18 10C18 4.47715 13.5228 0 8 0C2.47715 0 -2 4.47715 -2 10C-2 13 -0.5 15.5 1.5 18L1.5 22C1.5 23.3807 2.61929 24.5 4 24.5H12C13.3807 24.5 14.5 23.3807 14.5 22V18C16.5 15.5 18 13 18 10Z" 
