          transform="translate(20, 6)"/>
    
    <!-- 灯泡底座 -->
    <rect x="26" y="60" width="20" height="8" rx="3" fill="#F97316"/>
    <rect x="28" y="68" width="16" height="5" rx="2.4" fill="#F97316"/>
    
    <!-- 闪电符号 -->
    <path d="M40 26L34 38H39L32 50L39 38H34L40 26Z" fill="white" opacity="0.95"/>
