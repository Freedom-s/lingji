      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 灯泡图标 -->
  <g transform="translate(16, 12)">
    <!-- 灯泡主体 -->
    <path d="M36 20C36 8.95431 27.0457 0 16 0C4.95431 0 -4 8.95431 -4 20C-4 26 -1 31 3 36L3 44C3 46.7614 5.23858 49 8 49H24C26.7614 49 29 46.7614 29 44V36C33 31 36 26 36 20Z" 
